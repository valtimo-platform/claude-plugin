<p style="margin-bottom: 1.5rem">{{ 'actionDescription' | pluginTranslate: pluginId | async }}</p>

<v-form
  (valueChange)="formValueChange($event)"
  *ngIf="{
    disabled: disabled$ | async,
    prefill: prefill$ | async
  } as obs"
>
  <!--
    A textarea, not a text input: v-input's text branch binds [maxLength]="maxLength", whose
    default is 250 characters, and it is one line high. Neither is a prompt field. The
    textarea branch binds no maxLength at all.
  -->
  <v-input
    type="textarea"
    name="prompt"
    [title]="'prompt' | pluginTranslate: pluginId | async"
    [margin]="true"
    [defaultValue]="obs.prefill?.prompt"
    [disabled]="obs.disabled"
    [required]="true"
    [tooltip]="'promptTooltip' | pluginTranslate: pluginId | async"
    [fullWidth]="true"
    [rows]="8"
  ></v-input>
  <v-input
    type="textarea"
    name="systemPrompt"
    [title]="'systemPrompt' | pluginTranslate: pluginId | async"
    [margin]="true"
    [defaultValue]="obs.prefill?.systemPrompt"
    [disabled]="obs.disabled"
    [tooltip]="'actionSystemPromptTooltip' | pluginTranslate: pluginId | async"
    [fullWidth]="true"
    [rows]="4"
  ></v-input>
  <v-input
    name="documentResourceId"
    [title]="'documentResourceId' | pluginTranslate: pluginId | async"
    [margin]="true"
    [defaultValue]="obs.prefill?.documentResourceId"
    [disabled]="obs.disabled"
    [tooltip]="'documentResourceIdTooltip' | pluginTranslate: pluginId | async"
    placeholder="pv:resourceId"
  ></v-input>
  <v-input
    name="resultVariable"
    [title]="'resultVariable' | pluginTranslate: pluginId | async"
    [margin]="true"
    [defaultValue]="obs.prefill?.resultVariable"
    [disabled]="obs.disabled"
    [tooltip]="'resultVariableTooltip' | pluginTranslate: pluginId | async"
    placeholder="claudeAnswer"
  ></v-input>
  <valtimo-carbon-multi-input
    name="resultMappings"
    type="keyValue"
    [title]="'resultMappings' | pluginTranslate: pluginId | async"
    [tooltip]="'resultMappingsTooltip' | pluginTranslate: pluginId | async"
    [keyColumnTitle]="'resultMappingSource' | pluginTranslate: pluginId | async"
    [valueColumnTitle]="'resultMappingTarget' | pluginTranslate: pluginId | async"
    [addRowText]="'resultMappingAddRow' | pluginTranslate: pluginId | async"
    [defaultValues]="obs.prefill?.resultMappings ?? []"
    [disabled]="!!obs.disabled"
    [margin]="true"
    [fullWidth]="true"
  ></valtimo-carbon-multi-input>
</v-form>
